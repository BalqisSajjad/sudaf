<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة صُداف الأدبية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- رأس التطبيق -->
    <header class="bg-indigo-900 text-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">منصة صُداف الأدبية</h1>
        <div id="user-nav" class="flex gap-2 items-center text-sm">
            <!-- يتم تحديثه ديناميكياً عبر الجافاسكريبت -->
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="flex-grow p-4 max-w-md w-full mx-auto">
        
        <!-- رسائل التنبيه -->
        <div id="alert-box" class="hidden mb-4 p-3 rounded text-sm text-center"></div>

        <!-- 1. شاشة تسجيل الدخول / إنشاء الحساب -->
        <section id="auth-section" class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
            <h2 id="auth-title" class="text-lg font-bold mb-4 text-indigo-900 text-center">تسجيل الدخول</h2>
            
            <form id="auth-form" class="space-y-4" onsubmit="handleAuth(event)">
                <div>
                    <label class="block text-xs font-semibold mb-1">البريد الإلكتروني</label>
                    <input type="email" id="email" required class="w-full p-2 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">كلمة المرور</label>
                    <input type="password" id="password" required class="w-full p-2 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="submit" id="auth-btn" class="w-full bg-indigo-600 text-white py-2 rounded font-semibold text-sm hover:bg-indigo-700 transition">دخول</button>
            </form>

            <div class="mt-4 text-center text-xs">
                <button onclick="toggleAuthMode()" id="toggle-auth-text" class="text-indigo-600 hover:underline">ليس لديك حساب؟ أنشئ حساباً جديداً</button>
            </div>
        </section>

        <!-- 2. شاشة التحقق من البريد الإلكتروني (عند الإنشاء الأول) -->
        <section id="verify-section" class="hidden bg-white p-6 rounded-xl shadow-sm border border-slate-100 text-center">
            <h2 class="text-lg font-bold mb-2 text-indigo-900">التحقق من البريد الإلكتروني</h2>
            <p class="text-xs text-slate-600 mb-4">تم إرسال رمز التحقق إلى بريدك الإلكتروني. يرجى إدخاله لتفعيل الحساب.</p>
            <div class="space-y-4">
                <input type="text" id="verification-code" placeholder="أدخل رمز التحقق (مثال: 1234)" class="w-full p-2 border rounded text-center text-lg tracking-widest focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="verifyEmailCode()" class="w-full bg-emerald-600 text-white py-2 rounded font-semibold text-sm hover:bg-emerald-700 transition">تأكيد الرمز</button>
            </div>
        </section>

        <!-- 3. شاشة لوحة التحكم والمدونة (تظهر بعد تسجيل الدخول) -->
        <section id="app-section" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                <h3 id="welcome-user" class="font-bold text-indigo-900 text-base">مرحباً بك</h3>
                <p id="owner-badge" class="hidden text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded inline-block mt-1 font-semibold">حساب المالك</p>
            </div>

            <!-- نشر نص أدبي جديد -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                <h4 class="font-bold text-sm mb-3 text-slate-700">نشر عمل أدبي جديد</h4>
                <form onsubmit="publishPost(event)" class="space-y-3">
                    <input type="text" id="post-title" placeholder="عنوان النص" required class="w-full p-2 border rounded text-sm">
                    <textarea id="post-content" placeholder="اكتب النص الأدبي هنا..." rows="3" required class="w-full p-2 border rounded text-sm"></textarea>
                    <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded text-sm font-semibold hover:bg-indigo-700">نشر</button>
                </form>
            </div>

            <!-- عرض النصوص المنشورة -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                <h4 class="font-bold text-sm mb-3 text-slate-700">النصوص الأدبية</h4>
                <div id="posts-container" class="space-y-3 text-sm">
                    <!-- النصوص تظهر هنا ديناميكياً -->
                </div>
            </div>
        </section>

        <!-- 4. شاشة الملف الشخصي -->
        <section id="profile-section" class="hidden bg-white p-6 rounded-xl shadow-sm border border-slate-100 space-y-4">
            <h2 class="text-lg font-bold text-indigo-900 text-center">إدارة الملف الشخصي</h2>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold mb-1">البريد الإلكتروني</label>
                    <input type="email" id="profile-email" disabled class="w-full p-2 border rounded text-sm bg-slate-100 text-slate-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">الاسم الظاهر</label>
                    <input type="text" id="profile-name" class="w-full p-2 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">نبذة تعريفية</label>
                    <textarea id="profile-bio" rows="2" class="w-full p-2 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="اكتب نبذة عنك ككاتب..."></textarea>
                </div>
                <button onclick="saveProfile()" class="w-full bg-indigo-600 text-white py-2 rounded font-semibold text-sm hover:bg-indigo-700 transition">حفظ التعديلات</button>
                <button onclick="showAppSection()" class="w-full bg-slate-200 text-slate-700 py-2 rounded font-semibold text-sm hover:bg-slate-300 transition">العودة للرئيسية</button>
            </div>
        </section>

    </main>

    <!-- تذييل التطبيق -->
    <footer class="text-center p-4 text-xs text-slate-500 border-t bg-white mt-auto">
        منصة صُداف الأدبية &copy; 2026
    </footer>

    <!-- منطق العمل البرمجي (JavaScript) -->
    <script>
        const OWNER_EMAIL = "ludoiraq2008lx00@gmail.com";
        let isRegisterMode = false;
        let currentUser = JSON.parse(localStorage.getItem('suda_current_user')) || null;
        let posts = JSON.parse(localStorage.getItem('suda_posts')) || [];

        // التهيئة عند التحميل
        window.onload = function() {
            if (currentUser) {
                if (!currentUser.verified) {
                    showVerifySection();
                } else {
                    showAppSection();
                }
            }
            renderPosts();
        };

        function showAlert(message, type = 'error') {
            const box = document.getElementById('alert-box');
            box.textContent = message;
            box.className = `mb-4 p-3 rounded text-sm text-center ${type === 'success' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 4000);
        }

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-title').textContent = isRegisterMode ? 'إنشاء حساب جديد' : 'تسجيل الدخول';
            document.getElementById('auth-btn').textContent = isRegisterMode ? 'إنشاء وحفظ' : 'دخول';
            document.getElementById('toggle-auth-text').textContent = isRegisterMode ? 'لديك حساب بالفعل؟ سجل دخولك' : 'ليس لديك حساب؟ أنشئ حساباً جديداً';
        }

        function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (isRegisterMode) {
                // محاكاة إنشاء الحساب وإرسال رمز التحقق للإيميل
                currentUser = {
                    email: email,
                    password: password,
                    name: email.split('@')[0],
                    bio: '',
                    verified: false,
                    isOwner: (email === OWNER_EMAIL)
                };
                localStorage.setItem('suda_current_user', JSON.stringify(currentUser));
                showAlert('تم إنشاء الحساب! تم إرسال رمز التحقق إلى بريدك الإلكتروني (رمز محاكاة: 1234)', 'success');
                showVerifySection();
            } else {
                // تسجيل الدخول
                let savedUser = JSON.parse(localStorage.getItem('suda_current_user'));
                if (savedUser && savedUser.email === email && savedUser.password === password) {
                    currentUser = savedUser;
                    if (!currentUser.verified) {
                        showVerifySection();
                    } else {
                        showAppSection();
                        showAlert('مرحباً بك مجدداً!', 'success');
                    }
                } else {
                    showAlert('خطأ في البريد الإلكتروني أو كلمة المرور');
                }
            }
        }

        function verifyEmailCode() {
            const code = document.getElementById('verification-code').value.trim();
            if (code === '1234') {
                currentUser.verified = true;
                localStorage.setItem('suda_current_user', JSON.stringify(currentUser));
                showAlert('تم التحقق من البريد بنجاح!', 'success');
                showAppSection();
            } else {
                showAlert('رمز التحقق غير صحيح. (استخدم 1234 كمحاكاة)');
            }
        }

        function showVerifySection() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('verify-section').classList.remove('hidden');
            document.getElementById('app-section').classList.add('hidden');
            document.getElementById('profile-section').classList.add('hidden');
            document.getElementById('user-nav').innerHTML = '';
        }

        function showAppSection() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('verify-section').classList.add('hidden');
            document.getElementById('app-section').classList.remove('hidden');
            document.getElementById('profile-section').classList.add('hidden');

            document.getElementById('welcome-user').textContent = `مرحباً، ${currentUser.name || currentUser.email}`;
            
            if (currentUser.email === OWNER_EMAIL) {
                document.getElementById('owner-badge').classList.remove('hidden');
            }

            document.getElementById('user-nav').innerHTML = `
                <button onclick="showProfileSection()" class="bg-indigo-800 px-2.5 py-1 rounded hover:bg-indigo-700">الملف الشخصي</button>
                <button onclick="logout()" class="bg-rose-700 px-2.5 py-1 rounded hover:bg-rose-600">خروج</button>
            `;
            renderPosts();
        }

        function showProfileSection() {
            document.getElementById('app-section').classList.add('hidden');
            document.getElementById('profile-section').classList.remove('hidden');
            
            document.getElementById('profile-email').value = currentUser.email;
            document.getElementById('profile-name').value = currentUser.name || '';
            document.getElementById('profile-bio').value = currentUser.bio || '';
        }

        function saveProfile() {
            currentUser.name = document.getElementById('profile-name').value.trim();
            currentUser.bio = document.getElementById('profile-bio').value.trim();
            localStorage.setItem('suda_current_user', JSON.stringify(currentUser));
            showAlert('تم حفظ الملف الشخصي بنجاح', 'success');
            showAppSection();
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('suda_current_user');
            document.getElementById('app-section').classList.add('hidden');
            document.getElementById('verify-section').classList.add('hidden');
            document.getElementById('profile-section').classList.add('hidden');
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('user-nav').innerHTML = '';
            showAlert('تم تسجيل الخروج بنجاح', 'success');
        }

        function publishPost(e) {
            e.preventDefault();
            const title = document.getElementById('post-title').value.trim();
            const content = document.getElementById('post-content').value.trim();

            const newPost = {
                id: Date.now(),
                title,
                content,
                author: currentUser.name || currentUser.email,
                date: new Date().toLocaleDateString('ar-IQ')
            };

            posts.unshift(newPost);
            localStorage.setItem('suda_posts', JSON.stringify(posts));
            
            document.getElementById('post-title').value = '';
            document.getElementById('post-content').value = '';
            renderPosts();
            showAlert('تم نشر النص بنجاح', 'success');
        }

        function renderPosts() {
            const container = document.getElementById('posts-container');
            if (posts.length === 0) {
                container.innerHTML = '<p class="text-slate-400 text-center text-xs">لا توجد نصوص منشورة حتى الآن.</p>';
                return;
            }
            container.innerHTML = posts.map(p => `
                <div class="border-b pb-2 mb-2 last:border-none">
                    <h5 class="font-bold text-indigo-900">${p.title}</h5>
                    <p class="text-xs text-slate-600 mt-1 whitespace-pre-line">${p.content}</p>
                    <div class="flex justify-between items-center mt-2 text-[10px] text-slate-400">
                        <span>الكاتب: ${p.author}</span>
                        <span>${p.date}</span>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
  </html>
