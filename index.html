<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سُدف - منصة الأدب والنصوص</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-layout">
    
    <!-- القائمة الجانبية (Sidebar) والمحتويات الأساسية -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>القائمة الرئيسية</h2>
      </div>

      <!-- البروفايل وخلفية الصورة الشخصية (مخصص للمشرفين والمالكين لاختيار الصور المتحركة/GIF) -->
      <div class="profile-preview-box">
        <div class="profile-cover-background" id="profileCover">
          <div class="profile-avatar-container">
            <div class="avatar-circle">
              <span class="avatar-badge">مالك</span>
            </div>
          </div>
        </div>
        
        <!-- زر اختيار الصورة المتحركة والخلفية للمشرفين والمالكين -->
        <div class="admin-cover-upload">
          <label for="cover-file-input" class="upload-cover-btn">
            اختر خلفية متحركة (صورة / GIF)
          </label>
          <input type="file" id="cover-file-input" accept="image/*,image/gif" style="display: none;" onchange="handleCoverUpload(event)">
        </div>
      </div>

      <!-- روابط القائمة الرئيسية -->
      <nav class="nav-links">
        <a href="#" class="nav-item">🏠 الرئيسية</a>
        <a href="#" class="nav-item">📝 منشوراتي</a>
        <a href="#" class="nav-item">⚙️ الإعدادات العامة</a>
        <a href="#" class="nav-item">👥 الأعضاء</a>
        <a href="#" class="nav-item">💬 دردشة الإدارة</a>
        <a href="#" class="nav-item logout">🚪 تسجيل الخروج</a>
      </nav>

      <!-- قسم المالكين -->
      <div class="owners-section">
        <h3>المالكين</h3>
        <p>سجاد أحمد الأسدي</p>
        <p>بلقيس كاطع الطائي</p>
      </div>
    </aside>

    <!-- المحتوى الرئيسي للموقع ومنشورات النصوص -->
    <main class="main-content">
      <header class="top-bar">
        <h1>سُدف</h1>
      </header>

      <section class="posts-feed">
        <!-- منشور تجريبي يحتوي على أزرار الإعجاب والتعليق وإعادة النشر -->
        <article class="post-card" data-post-id="post_01">
          <div class="post-author-info">
            <span class="author">سجاد أحمد الأسدي</span>
            <span class="role-tag">مالك</span>
          </div>

          <div class="post-text">
            <p>أهلاً بكم جميعاً في منصة سُدف. تم تحديث الموقع وإضافة أزرار التفاعل الكاملة أسفل النصوص.</p>
          </div>

          <!-- أزرار التفاعل (إعجاب مع عداد، تعليق، إعادة نشر) -->
          <div class="post-footer">
            <div class="interaction-buttons">
              <!-- زر الإعجاب -->
              <button class="action-btn like-btn" onclick="toggleLike(this)">
                <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <span class="likes-count">14</span>
              </button>

              <!-- زر التعليق -->
              <button class="action-btn comment-btn" onclick="openComments(this)">
                <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                <span class="comments-count">3</span>
              </button>

              <!-- زر إعادة النشر -->
              <button class="action-btn repost-btn" onclick="repostPost(this)">
                <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
              </button>
            </div>
          </div>
        </article>
      </section>
    </main>

  </div>

  <script src="script.js"></script>
</body>
  </html>
