<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سُدُف - تسجيل الدخول</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #ffffff;
        }
        .site-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 1px;
            color: #ffffff;
        }
        .login-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            color: #333;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 22px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 14px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .auth-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 11px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        .auth-btn:hover {
            background-color: #219653;
        }
        .toggle-mode {
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }
        .toggle-mode a {
            color: #27ae60;
            text-decoration: none;
            cursor: pointer;
            font-weight: bold;
        }
        #user-info {
            display: none;
            margin-top: 15px;
            color: #27ae60;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- كلمة سُدُف في منتصف الشاشة فوق النموذج -->
    <div class="site-title">سُدُف</div>

    <div class="login-container">
        <h2 id="form-title">تسجيل الدخول</h2>
        
        <div class="input-group">
            <label>البريد الإلكتروني</label>
            <input type="email" id="email" placeholder="أدخل بريدك الإلكتروني">
        </div>

        <div class="input-group">
            <label>كلمة المرور</label>
            <input type="password" id="password" placeholder="أدخل كلمة المرور">
        </div>

        <button id="auth-btn" class="auth-btn">تسجيل الدخول</button>

        <div class="toggle-mode">
            <span id="toggle-text">ليس لديك حساب؟</span> 
            <a id="toggle-link">إنشاء حساب جديد</a>
        </div>

        <div id="user-info"></div>
    </div>

    <!-- تكوين فايربيس والمنطق البرمجي -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCND64kxigacSdgRqKJ9CtWU5DMfIpB1MQ",
            authDomain: "sudofnew.firebaseapp.com",
            projectId: "sudofnew",
            storageBucket: "sudofnew.firebasestorage.app",
            messagingSenderId: "707148495684",
            appId: "1:707148495684:web:958816d404a7e3da477511",
            measurementId: "G-TR4YVG88J3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let isSignUp = false;

        const formTitle = document.getElementById('form-title');
        const authBtn = document.getElementById('auth-btn');
        const toggleText = document.getElementById('toggle-text');
        const toggleLink = document.getElementById('toggle-link');
        const userInfo = document.getElementById('user-info');

        toggleLink.addEventListener('click', () => {
            isSignUp = !isSignUp;
            if (isSignUp) {
                formTitle.innerText = "إنشاء حساب جديد";
                authBtn.innerText = "إنشاء الحساب";
                toggleText.innerText = "لديك حساب بالفعل؟";
                toggleLink.innerText = "تسجيل الدخول";
            } else {
                formTitle.innerText = "تسجيل الدخول";
                authBtn.innerText = "تسجيل الدخول";
                toggleText.innerText = "ليس لديك حساب؟";
                toggleLink.innerText = "إنشاء حساب جديد";
            }
        });

        authBtn.addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert("الرجاء إدخال البريد الإلكتروني وكلمة المرور.");
                return;
            }

            if (isSignUp) {
                createUserWithEmailAndPassword(auth, email, password)
                    .then((result) => {
                        userInfo.style.display = 'block';
                        userInfo.innerText = `تم إنشاء الحساب بنجاح! جاري تحويلك...`;
                        setTimeout(() => {
                            window.location.href = "index.html";
                        }, 1000);
                    })
                    .catch((error) => {
                        alert("خطأ في إنشاء الحساب: " + error.message);
                    });
            } else {
                signInWithEmailAndPassword(auth, email, password)
                    .then((result) => {
                        userInfo.style.display = 'block';
                        userInfo.innerText = `أهلاً بك مجدداً! جاري تحويلك...`;
                        setTimeout(() => {
                            window.location.href = "index.html";
                        }, 1000);
                    })
                    .catch((error) => {
                        alert("خطأ في تسجيل الدخول: تأكد من البريد أو كلمة المرور.");
                    });
            }
        });
    </script>
</body>
  </html>
